  author: Allaguly Ahmedov
  defaultTheme: auto
  disableThemeToggle: false
  displayFullLangName: true
  ShowShareButtons: false
  ShowReadingTime: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  hideFooter: false

  socialIcons:
    - name: github
      url: "https://github.com/aallaguly01"
    - name: linkedin
      url: "https://www.linkedin.com/in/aallaguly01/"
    - name: telegram
      url: "https://t.me/aallaguly01"
    - name: email
      url: "mailto:aallaguly01@gmail.com"

languages:
  en:
    label: English
    locale: en-us
    weight: 1
    title: Allaguly Ahmedov
    params:
      description: "Backend / Platform engineer · Go"
