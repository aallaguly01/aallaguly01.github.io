baseURL: "https://aallaguly01.github.io/"
title: Allaguly Ahmedov
theme: PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML]

params:
